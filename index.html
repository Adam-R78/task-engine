<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Task Engine</title>
  <style>
    html, body, iframe { margin: 0; padding: 0; width: 100%; height: 100%; border: none; background: #0f172a; overflow: hidden; }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="microphone *"></iframe>
  <script>
    const BASE_URL = "https://script.google.com/macros/s/AKfycbxEn36zlnnkhN9ACBmQsOl3JM6s1zhY40rPKi8DYfywMBOCbku0AJpnSpQ7icZYOv2X/exec";
    const frame = document.getElementById("appFrame");
    frame.src = BASE_URL + window.location.search;

    let topRecorder = null;
    let topChunks = [];

    async function startTopCapture() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      topChunks = [];
      topRecorder = new MediaRecorder(stream);

      topRecorder.ondataavailable = (ev) => {
        if (ev.data && ev.data.size > 0) topChunks.push(ev.data);
      };

      topRecorder.onstop = () => {
        stream.getTracks().forEach((t) => t.stop());
        const mimeType = topRecorder.mimeType || "audio/webm";
        const blob = new Blob(topChunks, { type: mimeType });
        const reader = new FileReader();
        reader.onloadend = () => {
          const base64 = reader.result.split(",")[1];
          frame.contentWindow.postMessage({ type: "AUDIO_READY", base64, mimeType }, "*");
        };
        reader.readAsDataURL(blob);
      };

      topRecorder.start();
      frame.contentWindow.postMessage({ type: "RECORDING_STARTED" }, "*");
    }

    function showDirectTapControl() {
      let btn = document.getElementById("topRecBtn");
      if (!btn) {
        btn = document.createElement("button");
        btn.id = "topRecBtn";
        btn.style.cssText = "position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;border:none;border-radius:999px;padding:14px 24px;font:600 15px/1 -apple-system,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,0.5);z-index:9999;cursor:pointer;";
        document.body.appendChild(btn);
      }
      btn.textContent = "🎙️ Tap to Start Recording";
      btn.style.display = "block";
      btn.onclick = async () => {
        if (!topRecorder || topRecorder.state === "inactive") {
          try {
            await startTopCapture();
            btn.textContent = "⏹️ Tap to Stop & Send";
          } catch (err) {
            frame.contentWindow.postMessage({ type: "RECORDING_ERROR", message: err.message }, "*");
            btn.style.display = "none";
          }
        } else {
          topRecorder.stop();
          btn.style.display = "none";
        }
      };
    }

    window.addEventListener("message", async (e) => {
      if (!e.data || !e.data.type) return;

      if (e.data.type === "START_RECORDING") {
        try {
          await startTopCapture();
        } catch (err) {
          // If mobile browser requires a direct tap on the top-level frame, show fallback control
          showDirectTapControl();
        }
      } else if (e.data.type === "STOP_RECORDING") {
        if (topRecorder && topRecorder.state !== "inactive") {
          topRecorder.stop();
        }
      }
    });
  </script>
</body>
</html>
